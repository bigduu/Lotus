<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- iOS "Add to Home Screen" standalone app: run full-screen (no Safari
         chrome), let the dark app extend under a translucent status bar, and
         label the home-screen icon. Safe-area insets (App.css) keep content
         clear of the notch/dynamic-island and the home indicator. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bodhi" />
    <title>Bodhi</title>
  </head>

  <body>
    <div id="root">
      <div
        id="boot-status"
        style="
          display:flex;
          align-items:center;
          justify-content:center;
          height:100vh;
          padding:24px;
          font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
          color:#0f0f0f;
          background:#f6f6f6;
        "
      >
        Starting Bodhi UI...
      </div>
    </div>
    <script>
      (function () {
        var statusEl = document.getElementById("boot-status");
        var setStatus = function (message) {
          if (!statusEl || !statusEl.isConnected) return;
          statusEl.textContent = message;
        };
        var moduleScript = document.querySelector('script[type="module"][src]');
        var moduleSrc =
          moduleScript && moduleScript.getAttribute("src")
            ? new URL(moduleScript.getAttribute("src"), location.href).href
            : "(missing)";

        window.__BODHI_BOOT_STATUS__ = {
          setStatus: setStatus,
        };

        setTimeout(function () {
          setStatus(
            "Bodhi UI is still loading. href=" +
              location.href +
              " module=" +
              moduleSrc,
          );
        }, 5000);

        window.addEventListener(
          "error",
          function (event) {
            if (event && event.message) {
              var file = event.filename || "(unknown file)";
              var line = event.lineno || 0;
              var col = event.colno || 0;
              setStatus(
                "Startup error: " +
                  event.message +
                  " at " +
                  file +
                  ":" +
                  line +
                  ":" +
                  col,
              );
              return;
            }

            var target = event && event.target;
            if (target && target.tagName === "SCRIPT" && target.src) {
              setStatus("Failed to load script: " + target.src);
            }
          },
          true,
        );

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          var message =
            reason && reason.message ? reason.message : String(reason || "unknown");
          setStatus("Startup error: " + message);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
