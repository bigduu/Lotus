name: Publish NPM Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override package version to publish (for example: 2026.3.11). Leave empty or 'latest' to use package.json."
        required: false
        default: ""
        type: string
      skip_tests:
        description: "Skip npm run test:run (use only if CI has already passed)"
        required: false
        default: false
        type: boolean

permissions:
  # write: the publish records the released (date-based) version back to lotus main
  # so the source version tracks each release instead of freezing.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PROGRESS: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@bigduu"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify NPM token exists
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is missing. Configure repository secret NPM_TOKEN first."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Set package version (workflow override)
        if: github.event.inputs.version != '' && github.event.inputs.version != 'latest'
        run: |
          TARGET_VERSION="${{ github.event.inputs.version }}"
          npm version "${TARGET_VERSION}" --no-git-tag-version --allow-same-version
          echo "Using package version override: $(node -p "require('./package.json').version")"

      - name: Type check
        continue-on-error: true
        run: npm run type-check

      - name: Run tests
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true'
        run: npm run test:run

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "${TAG}" != "v${VERSION}" ] && [ "${TAG}" != "lotus-v${VERSION}" ]; then
            echo "Tag (${TAG}) does not match package version (${VERSION})."
            exit 1
          fi

      - name: Dry run package check
        run: npm pack --dry-run

      - name: Publish to npm
        run: |
          set +e
          PUBLISH_OUTPUT="$(npm publish --provenance --access public 2>&1)"
          STATUS=$?
          set -e

          echo "${PUBLISH_OUTPUT}"

          if [ ${STATUS} -eq 0 ]; then
            exit 0
          fi

          if echo "${PUBLISH_OUTPUT}" | grep -q "You cannot publish over the previously published versions"; then
            echo "Package version is already published on npm. Treating as success."
            exit 0
          fi

          exit ${STATUS}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Record the released version back to main
        # The nightly only bumps the Zenith config and cannot push into this repo,
        # so lotus's source version would otherwise drift. After a successful
        # publish, commit the (date-based) release version here so the source tracks.
        if: github.event.inputs.version != '' && github.event.inputs.version != 'latest'
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Source version already ${VERSION}; nothing to commit."
            exit 0
          fi
          git commit -m "chore: set version to ${VERSION} [release]"
          git push origin HEAD:main
