name: E2E Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-tests.yml'

jobs:
  test-browser-mode:
    # E2E currently depends on external/backend runtime behavior and is flaky.
    # Keep running for visibility, but do not fail the whole repository checks.
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PROGRESS: "false"

    steps:
      - uses: actions/checkout@v6

      - name: Checkout Bamboo backend
        uses: actions/checkout@v6
        with:
          repository: bigduu/Bamboo-agent
          path: bamboo-backend

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache frontend node_modules
        id: cache-node-modules-frontend
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.cache-node-modules-frontend.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Build frontend
        run: npm run build

      - name: Cache E2E node_modules
        id: cache-node-modules-e2e
        uses: actions/cache@v5
        with:
          path: e2e/node_modules
          key: ${{ runner.os }}-e2e-node-modules-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install E2E dependencies
        if: steps.cache-node-modules-e2e.outputs.cache-hit != 'true'
        run: npm --prefix ./e2e ci --prefer-offline --no-audit

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Build backend for E2E
        run: cargo build --manifest-path bamboo-backend/Cargo.toml --release --bin bamboo

      - name: Start backend
        run: |
          ./bamboo-backend/target/release/bamboo serve --port 9562 --bind 127.0.0.1 --data-dir /tmp/test-data &
          echo "Waiting for backend to be healthy..."
          for i in {1..30}; do
            if curl -f http://127.0.0.1:9562/api/v1/health 2>/dev/null; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i/30: Backend not ready yet..."
            sleep 2
          done
          echo "Backend health check failed"
          exit 1

      - name: Start frontend preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 1420 &
          sleep 5

      - name: Run E2E tests
        run: npm run test:e2e:browser
        env:
          E2E_BASE_URL: http://127.0.0.1:1420
          E2E_API_URL: http://127.0.0.1:9562
          E2E_SUITE: browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-browser
          path: e2e/playwright-report/
