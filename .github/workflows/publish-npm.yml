name: Publish NPM Package

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip npm run test:run (use only if CI has already passed)"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"
      - "lotus-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@bigduu"
          cache: "npm"

      - name: Verify NPM token exists
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is missing. Configure repository secret NPM_TOKEN first."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run tests
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true'
        run: npm run test:run

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "${TAG}" != "v${VERSION}" ] && [ "${TAG}" != "lotus-v${VERSION}" ]; then
            echo "Tag (${TAG}) does not match package version (${VERSION})."
            exit 1
          fi

      - name: Dry run package check
        run: npm pack --dry-run

      - name: Publish to npm
        run: |
          set +e
          PUBLISH_OUTPUT="$(npm publish --provenance --access public 2>&1)"
          STATUS=$?
          set -e

          echo "${PUBLISH_OUTPUT}"

          if [ ${STATUS} -eq 0 ]; then
            exit 0
          fi

          if echo "${PUBLISH_OUTPUT}" | grep -q "You cannot publish over the previously published versions"; then
            echo "Package version is already published on npm. Treating as success."
            exit 0
          fi

          exit ${STATUS}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
